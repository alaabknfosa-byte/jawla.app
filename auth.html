<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>جولة - دخول</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
body{font-family:sans-serif;text-align:center;padding:30px;background:#f5f5f5}
.box{background:white;padding:20px;border-radius:15px;max-width:350px;margin:auto}
input{width:90%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc}
button{width:95%;padding:12px;background:#ff6b35;color:white;border:none;border-radius:10px;font-size:16px}
a{color:#ff6b35;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h2 id="title">تسجيل الدخول</h2>
<input type="email" id="email" placeholder="الإيميل">
<input type="password" id="password" placeholder="كلمة السر">
<button id="mainBtn" onclick="doAuth()">دخول</button>
<p id="switchText">ما عندكش حساب؟ <a onclick="toggle()">إنشاء حساب جديد</a></p>
</div>
<script>
const firebaseConfig = {
  apiKey: "حط_هنا",
  authDomain: "حط_هنا",
  projectId: "حط_هنا",
  appId: "حط_هنا"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
let isLogin = true;
function toggle(){
  isLogin = !isLogin;
  if(isLogin){
    document.getElementById("title").innerText="تسجيل الدخول";
    document.getElementById("mainBtn").innerText="دخول";
    document.getElementById("switchText").innerHTML='ما عندكش حساب؟ <a onclick="toggle()">إنشاء حساب جديد</a>';
  } else {
    document.getElementById("title").innerText="إنشاء حساب جديد";
    document.getElementById("mainBtn").innerText="إنشاء حساب";
    document.getElementById("switchText").innerHTML='عندك حساب؟ <a onclick="toggle()">سجل دخول</a>';
  }
}
function doAuth(){
  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;
  if(!email||!password){alert("عبي الإيميل وكلمة السر");return;}
  if(isLogin){
    auth.signInWithEmailAndPassword(email,password).then((u)=>{
      localStorage.setItem("user",u.user.email);
      alert("تم الدخول بنجاح!");
      window.location.href="index.html";
    }).catch(()=>alert("خطأ: تأكد من الإيميل وكلمة السر"));
  } else {
    auth.createUserWithEmailAndPassword(email,password).then((u)=>{
      localStorage.setItem("user",u.user.email);
      alert("تم إنشاء الحساب بنجاح!");
      window.location.href="index.html";
    }).catch((e)=>alert("خطأ: "+e.message));
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصقر الذهبي - تسجيل حقيقي</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:#111;border:2px solid #d4af37;border-radius:20px;padding:20px}
h1{text-align:center;color:#d4af37}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #d4af37;background:#000;color:#fff;box-sizing:border-box}
button{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:none;background:#d4af37;color:#000;font-weight:bold;font-size:17px;cursor:pointer}
button.sec{background:transparent;color:#d4af37;border:1px solid #d4af37}
#msg{text-align:center;min-height:24px;color:#ffcc00}
</style>
</head>
<body>
<div class="box">
<h1>🦅 الصقر الذهبي</h1>
<p id="msg"></p>
<input id="name" placeholder="الاسم - مثال: مالك">
<input id="email" type="email" placeholder="البريد - مثال: malk@gmail.com">
<input id="pass" type="password" placeholder="كلمة السر - 6 حروف على الأقل">
<button id="btnSignup">إنشاء حساب جديد - حقيقي</button>
<button id="btnLogin" class="sec">عندك حساب؟ سجل دخول</button>
<button id="btnForgot" class="sec">نسيت كلمة السر؟</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBaCuF-iKp6hNEApmEoaYoRQi-GXj6ABcA",
  authDomain: "jawla-bc7ca.firebaseapp.com",
  projectId: "jawla-bc7ca",
  storageBucket: "jawla-bc7ca.firebasestorage.app",
  messagingSenderId: "131261683793",
  appId: "1:131261683793:web:5c4e84eaf7ae5d719f8070",
  measurementId: "G-Y1LQL1TZRN"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const msg = document.getElementById('msg');
function show(t){ msg.textContent = t; }
document.getElementById('btnSignup').onclick = async () => {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  if(!email.includes('@')){ show('دير بريد صح زي malk@gmail.com'); return; }
  if(pass.length < 6){ show('كلمة السر لازم 6 حروف على الأقل'); return; }
  try{
    show('جاري إنشاء حسابك الحقيقي...');
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    if(name) await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, "users", cred.user.uid), { name: name || "", email: email, createdAt: new Date().toISOString() });
    show('تم ✅ حسابك حقيقي وتسجل في Firebase');
    setTimeout(()=> location.href = 'index.html', 1200);
  }catch(e){ show('خطأ: ' + e.message); }
};
document.getElementById('btnLogin').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  try{
    show('جاري الدخول...');
    await signInWithEmailAndPassword(auth, email, pass);
    show('تم الدخول ✅');
    setTimeout(()=> location.href = 'index.html', 800);
  }catch(e){ show('خطأ في الدخول: ' + e.message); }
};
document.getElementById('btnForgot').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  if(!email.includes('@')){ show('اكتب بريدك أولا'); return; }
  await sendPasswordResetEmail(auth, email);
  show('بعتنا رابط استرجاع لبريدك');
};
</script>
</body>
</html>

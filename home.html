<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>جولة - الرئيسية</title></head>
<body style="font-family:sans-serif;text-align:center;padding:30px">
<h1>أهلا بيك في جولة 🔥</h1>
<p id="welcome"></p>
<button onclick="logout()">تسجيل خروج</button>
<script>
let user = localStorage.getItem("user");
if(!user){ window.location.href="auth.html"; }
else { document.getElementById("welcome").innerText = "مخشوش بحساب: " + user; }
function logout(){ localStorage.removeItem("user"); window.location.href="auth.html"; }
</script>
</body>
</html>

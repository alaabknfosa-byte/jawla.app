<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصقر الذهبي</title>
<style>
body{font-family:Arial;background:#000;color:#fff;margin:0;padding-bottom:90px}
header{display:flex;justify-content:space-between;padding:15px;background:#111;align-items:center;position:sticky;top:0;z-index:10}
.feed{max-width:420px;margin:auto;padding:10px}
.video-card{background:#1a1a1a;border-radius:15px;overflow:hidden;margin-bottom:20px}
.video-card img{width:100%;display:block}
.info{padding:12px}
.actions{display:flex;gap:10px;padding:0 12px 12px}
.actions button{background:#2a2a2a;color:#fff;border:none;padding:10px 16px;border-radius:20px;cursor:pointer}
.actions button.liked{background:#FFD700;color:#000}
#loginBar{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:1px solid #333;padding:15px;display:none;z-index:100;text-align:center}
#loginBar button{background:#FFD700;color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;margin:5px;cursor:pointer}
#loginBar .close{background:#333;color:#fff}
</style>
</head>
<body>
<header>
<b>🦅 الصقر الذهبي</b>
<button id="topBtn" onclick="goAuth()" style="background:#FFD700;border:none;padding:8px 14px;border-radius:8px;font-weight:bold">تسجيل الدخول</button>
</header>
<div class="feed">
<div class="video-card">
<img src="https://picsum.photos/400/500">
<div class="info"><b>مستخدم تجريبي</b><p>هذا فيديو تجريبي للعرض. التطبيق مفتوح الآن.</p></div>
<div class="actions">
<button onclick="doLike(this)">❤️ إعجاب</button>
<button onclick="doComment()">💬 تعليق</button>
</div>
</div>
<div class="video-card">
<img src="https://picsum.photos/400/501">
<div class="info"><b>مستخدم آخر</b><p>شاهد بدون حساب، وتفاعل بعد إنشاء حساب.</p></div>
<div class="actions">
<button onclick="doLike(this)">❤️ إعجاب</button>
<button onclick="doComment()">💬 تعليق</button>
</div>
</div>
</div>
<div id="loginBar">
<p style="margin:0 0 10px">يرجى إنشاء حساب للتفاعل مع المنشورات</p>
<button onclick="goAuth()">إنشاء حساب</button>
<button onclick="goAuth()">تسجيل الدخول</button>
<button class="close" onclick="hideBar()">إغلاق</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyBaCuF-iKp6hNEApmEoaYoRQi-GXj6ABcA",
  authDomain: "jawla-bc7ca.firebaseapp.com",
  projectId: "jawla-bc7ca",
  storageBucket: "jawla-bc7ca.firebasestorage.app",
  messagingSenderId: "131261683793",
  appId: "1:131261683793:web:5c4e84eaf7ae5d719f8070",
  measurementId: "G-Y1LQL1TZRN"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let currentUser = null;
onAuthStateChanged(auth, (user)=>{
  currentUser = user;
  if(user){ document.getElementById('topBtn').innerText = user.displayName || "حسابي"; }
});
window.goAuth = () => { window.location.href = "auth.html"; };
window.hideBar = () => { document.getElementById('loginBar').style.display = "none"; };
window.doLike = (btn) => {
  if(!currentUser){ document.getElementById('loginBar').style.display = "block"; return; }
  btn.classList.toggle('liked');
  btn.innerText =btn.classList.contains('liked') ? "❤️ تم الإعجاب" : "❤️ إعجاب";
};
window.doComment = () => {
  if(!currentUser){ document.getElementById('loginBar').style.display = "block"; return; }
  const c = prompt("اكتب تعليقك:");
  if(c) alert("تم نشر تعليقك: " + c);
};
</script>
</body>
</html>

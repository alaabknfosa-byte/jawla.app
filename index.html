<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAWLA - جولة</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;margin:0;padding:0}
header{background:#000;padding:12px;text-align:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
header b{font-size:22px} header b span{color:#fe2c55}
button{background:#fe2c55;color:#fff;border:0;padding:11px 16px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin-top:8px}
.card{background:#111;margin:10px;padding:12px;border-radius:14px;border:1px solid #222}
.tabs{display:flex;gap:6px;padding:10px}
.tabs button{background:#222;margin:0}
.tabs button.active{background:#fe2c55}
.small{color:#aaa;font-size:13px}
.pink{color:#fe2c55;font-weight:bold}
.badge{background:#fe2c55;color:#fff;padding:2px 8px;border-radius:20px;font-size:12px}
.blue{color:#1da1f2}
.hidden{display:none}
img,video{width:100%;border-radius:12px;margin-top:8px;background:#000}
.center{text-align:center;padding:20px}
</style>
</head>
<body>
<header><b>JAWLA <span>جولة</span></b></header>

<!-- الدخول / انشاء حساب -->
<div id="auth" class="center">
  <h2>مرحبا في <span class="pink">جولة</span> 🔥</h2>
  <div id="loginBox">
    <input id="loginEmail" placeholder="البريد الإلكتروني">
    <input id="loginPass" type="password" placeholder="كلمة السر">
    <button onclick="doLogin()">دخول</button>
    <p><a href="#" class="pink" onclick="showForgot();return false">هل نسيت كلمة السر؟</a></p>
    <p class="small">ماعندكش حساب؟ <a href="#" class="pink" onclick="showSignup();return false">إنشاء حساب</a></p>
  </div>
  <div id="signupBox" class="hidden">
    <input id="suName" placeholder="الاسم">
    <input id="suAge" type="number" placeholder="العمر">
    <input id="suEmail" placeholder="البريد الإلكتروني">
    <input id="suPass" type="password" placeholder="كلمة السر - 6 حروف وفوق">
    <button onclick="doSignup()">إنشاء حساب</button>
    <p><a href="#" class="pink" onclick="showLogin();return false">عندك حساب؟ دخول</a></p>
  </div>
  <div id="forgotBox" class="hidden">
    <p>اكتب ايميلك، نبعثولك كود</p>
    <input id="foEmail" placeholder="البريد الإلكتروني">
    <button onclick="sendCode()">ابعت الكود</button>
    <input id="foCode" placeholder="الكود - جرب 1234">
    <input id="foNewPass" type="password" placeholder="كلمة السر الجديدة">
    <button onclick="resetPass()">تغيير كلمة السر</button>
    <p><a href="#" class="pink" onclick="showLogin();return false">رجوع للدخول</a></p>
  </div>
</div>

<!-- التطبيق -->
<div id="app" class="hidden">
  <div class="tabs">
    <button id="tabHome" class="active" onclick="showTab('home')">الرئيسية 🎥</button>
    <button id="tabTweets" onclick="showTab('tweets')">تغريدات 💬</button>
    <button id="tabFriends" onclick="showTab('friends')">أصدقاء 👥</button>
    <button id="tabMe" onclick="showTab('me')">أنا 👤</button>
  </div>

  <div class="card">
    <textarea id="postText" placeholder="شن تبي تنزل اليوم؟ فيديو ولا منشور ولا صورة..."></textarea>
    <input type="file" id="postFile" accept="image/*,video/*">
    <button onclick="addPost()">+ نشر</button>
    <p class="small">الدفع والترويج: <b class="pink">TNPYfL44zzrNAwpm6CkbU6yT6bpqsg95r9</b> - USDT TRC20</p>
  </div>

  <div id="homeTab"><div id="feed"></div></div>
  <div id="tweetsTab" class="hidden"><div id="tweetsFeed"></div></div>
  <div id="friendsTab" class="hidden">
    <div class="card"><b>أصدقاء مقترحين</b><p class="small">أحمد - ليبيا | مريم - طرابلس | علي - مصراتة</p><button onclick="alert('تم ارسال طلب صداقة ✅')">+ إضافة صديق</button><button onclick="alert('تمت دعوتك للايف ✅ اطلع لايف توا')">دعوة للايف 🎙️</button></div>
  </div>
  <div id="meTab" class="hidden">
    <div class="card"><h3 id="myName">أنا</h3><p id="myEmail" class="small"></p><p>توثيق العلامة الزرقاء ✅</p><input type="file" accept="image/*"><button onclick="alert('تم ارسال جوازك للمراجعة، تاخد العلامة الزرقاء بعد التأكيد ✅')">اطلب العلامة الزرقاء ✅</button><button onclick="logout()" style="background:#222">تسجيل خروج</button></div>
  </div>
</div>

<script>
const WALLET="TNPYfL44zzrNAwpm6CkbU6yT6bpqsg95r9";
let users=JSON.parse(localStorage.getItem('jawla_users')||'[]');
let posts=JSON.parse(localStorage.getItem('jawla_posts')||'[]');
let current=localStorage.getItem('jawla_current')||null;
if(current){document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');updateMe();renderAll();}

function showLogin(){hideAll();document.getElementById('loginBox').classList.remove('hidden')}
function showSignup(){hideAll();document.getElementById('signupBox').classList.remove('hidden')}
function showForgot(){hideAll();document.getElementById('forgotBox').classList.remove('hidden')}
function hideAll(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('signupBox').classList.add('hidden');document.getElementById('forgotBox').classList.add('hidden')}

function doSignup(){
  let n=document.getElementById('suName').value.trim(),a=document.getElementById('suAge').value,e=document.getElementById('suEmail').value.trim(),p=document.getElementById('suPass').value;
  if(!n||!e||!p||p.length<6) return alert('عبي البيانات صح، كلمة السر 6 وفوق');
  if(users.find(u=>u.email===e)) return alert('هذا الايميل موجود، دير دخول');
  users.push({name:n,age:a,email:e,pass:p});localStorage.setItem('jawla_users',JSON.stringify(users));
  alert('تم انشاء حسابك ✅ توا خش');showLogin();
}
function doLogin(){
  let e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value;
  let u=users.find(x=>x.email===e&&x.pass===p);
  if(!u) return alert('الايميل ولا كلمة السر غلط');
  current=e;localStorage.setItem('jawla_current',e);
  document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');updateMe();renderAll();
}
function sendCode(){alert('الكود متاعك هو: 1234 - اكتبه في الخانة اللي تحت');}
function resetPass(){
  let e=document.getElementById('foEmail').value.trim(),c=document.getElementById('foCode').value,np=document.getElementById('foNewPass').value;
  if(c!=='1234') return alert('الكود غلط، جرب 1234');
  let u=users.find(x=>x.email===e);if(!u) return alert('الايميل مش موجود');
  u.pass=np;localStorage.setItem('jawla_users',JSON.stringify(users));alert('تم تغيير كلمة السر ✅ توا خش بيها');showLogin();
}
function logout(){localStorage.removeItem('jawla_current');location.reload();}
function updateMe(){let u=users.find(x=>x.email===current);if(u){document.getElementById('myName').innerText=u.name+' ✅';document.getElementById('myEmail').innerText=u.email;}}
function showTab(t){
  ['home','tweets','friends','me'].forEach(x=>document.getElementById(x+'Tab').classList.add('hidden'));
  document.getElementById(t+'Tab').classList.remove('hidden');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
}
function addPost(){
  let txt=document.getElementById('postText').value.trim();if(!txt&&!document.getElementById('postFile').files[0]) return alert('اكتب شي ولا اختار صورة / فيديو');
  let u=users.find(x=>x.email===current);let name=u?u.name:'ضيف';
  let file=document.getElementById('postFile').files[0];
  let url='';let type='text';
  if(file){url=URL.createObjectURL(file);type=file.type.includes('video')?'video':'image';}
  posts.unshift({id:Date.now(),name:name,text:txt,url:url,type:type,promoted:false,likes:0});
  localStorage.setItem('jawla_posts',JSON.stringify(posts));document.getElementById('postText').value='';renderAll();alert('تم النشر ✅');
}
function promotePost(id){
  let ok=confirm('ترويج أوتوماتيك 🔥\n\n5$ = 10 أيام\nالوصول المتوقع: 3500+ يوميا\n\nابعت 5$ USDT - TRC20 لهذا العنوان:\n'+WALLET+'\n\nاضغط موافق بعد ما تحول');
  if(!ok) return;
  let paid=confirm('هل حولت 5$ توا؟ اضغط موافق باش نروجلك طول 10 أيام');
  if(!paid) return;
  let p=posts.find(x=>x.id===id);p.promoted=true;p.days=10;localStorage.setItem('jawla_posts',JSON.stringify(posts));renderAll();alert('تم ✅ تم ترويج منشورك طول 10 أيام - الوصول 3500+ يوميا');
}
function renderAll(){
  let html='';
  if(posts.length===0) html='<div class="card center">مافيش منشورات توا، انشر اول واحد 🔥</div>';
  posts.forEach(p=>{
    let promo=p.promoted?'<div><span class="badge">🔥 مروّج - 10 أيام | 👀 3500+ يوميا</span></div>':'';
    let media=p.type==='video'?'<video controls src="'+p.url+'"></video>':p.type==='image'?'<img src="'+p.url+'">':'';
    html+='<div class="card">'+promo+'<b>'+p.name+' <span class="blue">✅</span></b><p>'+p.text+'</p>'+media+'<br><button style="background:#222" onclick="alert(\'تم الاعجاب ❤️\')">❤️ اعجاب</button> <button onclick="promotePost('+p.id+')">🚀 روّج - 5$ / 10 أيام</button></div>';
  });
  document.getElementById('feed').innerHTML=html;
  document.getElementById('tweetsFeed').innerHTML=html;
}
renderAll();
</script>
</body>
</html>
